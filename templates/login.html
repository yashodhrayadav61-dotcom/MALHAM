<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MALHAM Healthcare</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/malham-logo.svg') }}?v=4" type="image/svg+xml">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        [data-theme="dark"] {
            --bg-img-1: url("{{ url_for('static', filename='img/login_bg_dark_1.jpg') }}?v=3");
            --bg-img-2: url("{{ url_for('static', filename='img/login_bg_dark_2.jpg') }}?v=3");
            --bg-overlay: linear-gradient(135deg, rgba(15,15,20,0.75), rgba(40,10,15,0.70));
        }
        [data-theme="light"] {
            --bg-img-1: url("{{ url_for('static', filename='img/login_bg_light_1.jpg') }}?v=3");
            --bg-img-2: url("{{ url_for('static', filename='img/login_bg_light_2.jpg') }}?v=3");
            --bg-overlay: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,235,240,0.55));
        }
        .bg-slideshow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background-color: var(--theme-bg);
            overflow: hidden;
        }
        .bg-img {
            position: absolute;
            top: -5%; left: -5%; right: -5%; bottom: -5%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .bg-img.slide-1 { background-image: var(--bg-img-1); }
        .bg-img.slide-2 { background-image: var(--bg-img-2); }
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-overlay);
            z-index: 1;
        }
        @keyframes slideZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .bg-img.active {
            opacity: 1;
            animation: slideZoom 15s linear forwards;
        }
        @media (prefers-reduced-motion: reduce) {
            .bg-img.active { animation: none; }
        }
        [data-theme="dark"] .login-header-outside { color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        [data-theme="light"] .login-header-outside { color: #0a0a0d; text-shadow: 0 2px 10px rgba(255,255,255,0.8); }
    </style>
    
    <script>
        // Apply theme immediately to avoid flash of unstyled content
        (function() {
            try {
                var storedTheme = localStorage.getItem('malham-theme');
                if (storedTheme) {
                    document.documentElement.setAttribute('data-theme', storedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="login-page-body animate-entrance">
    
    <div class="exit-progress-bar" id="exitProgress"></div>

    <button id="themeToggleBtn" class="login-theme-toggle" aria-label="Toggle Theme" style="position: absolute; top: 24px; right: 24px; z-index: 100;">
        <i class="ri-sun-line icon-sun"></i>
        <i class="ri-moon-line icon-moon"></i>
    </button>

    <div class="bg-slideshow">
        <div class="bg-img slide-1 active"></div>
        <div class="bg-img slide-2"></div>
        <div class="bg-overlay"></div>
    </div>

        <!-- Center Card Zone -->
        <div class="login-card-zone" style="flex-direction: column; align-items: center;">
            <div class="login-header-outside" style="text-align: center; margin-bottom: 24px;">
                <div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px;">
                    <svg viewBox="0 0 100 100" style="width: 56px; height: 56px;" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="8" width="84" height="84" rx="22" fill="var(--theme-primary)" opacity="0.12"/>
                        <rect x="8" y="8" width="84" height="84" rx="22" stroke="var(--theme-primary)" stroke-width="2.5" fill="none" opacity="0.25"/>
                        <path d="M 24 72 L 24 38 L 36 38 L 44 22 L 56 78 L 64 38 L 76 38 L 76 72" stroke="var(--theme-primary)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M 24 72 L 24 38" stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none"/>
                        <path d="M 76 38 L 76 72" stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none"/>
                    </svg>
                    <h1 class="login-title" style="margin: 0; font-size: 2.5rem; letter-spacing: 0.05em; font-weight: 800;">MALHAM</h1>
                </div>
                <p class="login-subtitle" style="margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; font-weight: 600; text-transform: uppercase;">ONE PLATFORM. ONE CONNECTED CARE JOURNEY.</p>
            </div>
            
            <div class="login-card">

                {% if error %}
                    <div class="login-error-banner">
                        <i class="ri-error-warning-line"></i>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="login-error-banner">
                        <i class="ri-error-warning-line"></i>
                        <span>{{ message }}</span>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="/login" id="loginForm">
                    <div class="login-form-group">
                        <label class="login-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="login-input" required autocomplete="username" placeholder="Enter your username">
                    </div>
                    
                    <div class="login-form-group">
                        <label class="login-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="login-input" required autocomplete="current-password" placeholder="••••••••">
                        <button type="button" class="password-toggle" id="pwdToggle" tabindex="-1">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-login-primary" id="loginSubmitBtn">
                        <i class="ri-login-circle-line" style="margin-right: 8px;"></i> Access System
                    </button>
                </form>

                <div class="login-divider">Quick Demo Login</div>

                <div class="demo-roles-grid">
                    <form method="POST" action="/login" class="demo-form">
                        <input type="hidden" name="demo_role" value="head_doctor">
                        <button type="submit" class="btn-demo-role" onclick="showExitLoading(this)"><i class="ri-stethoscope-line"></i> Head Doctor / Dr. Suresh Kumar</button>
                    </form>
                    
                    <form method="POST" action="/login" class="demo-form">
                        <input type="hidden" name="demo_role" value="doctor">
                        <button type="submit" class="btn-demo-role" onclick="showExitLoading(this)"><i class="ri-nurse-line"></i> Doctor / Dr. Anita Desai</button>
                    </form>
                    
                    <form method="POST" action="/login" class="demo-form">
                        <input type="hidden" name="demo_role" value="staff">
                        <button type="submit" class="btn-demo-role" onclick="showExitLoading(this)"><i class="ri-group-line"></i> Staff / Nurse Sarah</button>
                    </form>
                    
                    <form method="POST" action="/login" class="demo-form">
                        <input type="hidden" name="demo_role" value="patient">
                        <button type="submit" class="btn-demo-role" onclick="showExitLoading(this)"><i class="ri-user-heart-line"></i> Patient / Aarav Sharma</button>
                    </form>
                </div>
            </div>
        </div>

    <script>
        // Slideshow Logic
        const slides = document.querySelectorAll('.bg-img');
        if (window.matchMedia("(prefers-reduced-motion: no-preference)").matches && slides.length > 0) {
            let currentSlide = 0;
            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                
                // Force a reflow so the animation restarts
                void slides[currentSlide].offsetWidth;
                
                slides[currentSlide].classList.add('active');
            }, 7000);
        }

        // Theme Toggle Logic
        const toggleBtn = document.getElementById('themeToggleBtn');
        const root = document.documentElement;

        toggleBtn.addEventListener('click', () => {
            const currentTheme = root.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            try {
                localStorage.setItem('malham-theme', newTheme);
            } catch(e) {}
        });

        // Password Visibility Toggle
        const pwdInput = document.getElementById('password');
        const pwdToggleBtn = document.getElementById('pwdToggle');
        
        if(pwdToggleBtn && pwdInput) {
            pwdToggleBtn.addEventListener('click', () => {
                const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdInput.setAttribute('type', type);
                
                const icon = pwdToggleBtn.querySelector('i');
                if (type === 'text') {
                    icon.classList.remove('ri-eye-line');
                    icon.classList.add('ri-eye-off-line');
                } else {
                    icon.classList.remove('ri-eye-off-line');
                    icon.classList.add('ri-eye-line');
                }
            });
        }

        // Exit Animation
        const loginForm = document.getElementById('loginForm');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        
        function showExitLoading(btnElement = null) {
            document.body.classList.add('is-exiting');
            
            if (btnElement) {
                const originalContent = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Authenticating...';
                btnElement.style.pointerEvents = 'none';
            }
        }

        if(loginForm) {
            loginForm.addEventListener('submit', (e) => {
                // Allow the form to submit naturally, just add visual flair
                showExitLoading(loginSubmitBtn);
            });
        }
    </script>
</body>
</html>

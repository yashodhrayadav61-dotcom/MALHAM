<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found – MALHAM Hospital Portal</title>
    
    <!-- Theme Detection Before First Paint -->
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('malham-theme');
                if (savedTheme === 'light' || savedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                } else {
                    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='img/malham-logo.svg') }}" type="image/svg+xml">

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--theme-bg);
            color: var(--theme-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .error-card {
            background: var(--theme-panel);
            border: 1px solid var(--theme-panel-border);
            border-radius: 20px;
            padding: 44px 36px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: var(--theme-shadow);
            backdrop-filter: blur(12px);
        }

        .error-icon-box {
            width: 80px;
            height: 80px;
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid var(--theme-primary);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--theme-primary);
            font-size: 2.5rem;
            margin-bottom: 20px;
            filter: var(--theme-logo-glow);
        }

        .error-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--theme-text);
        }

        .error-subtitle {
            font-size: 1.05rem;
            color: var(--theme-primary);
            font-weight: 600;
            margin-bottom: 14px;
        }

        .error-desc {
            font-size: 0.92rem;
            color: var(--theme-text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-group-error {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-back {
            padding: 10px 20px;
            background: var(--theme-demo-bg);
            border: 1px solid var(--theme-demo-border);
            border-radius: 10px;
            color: var(--theme-text);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: var(--theme-demo-hover-bg);
            border-color: var(--theme-demo-hover-border);
        }

        .btn-primary-glow {
            padding: 10px 20px;
            background: var(--theme-primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: var(--theme-btn-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-glow:hover {
            background: var(--theme-primary-hover);
            transform: translateY(-1px);
        }

        .badge-code {
            display: inline-block;
            background: rgba(225, 29, 72, 0.1);
            color: var(--theme-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.82rem;
            margin-bottom: 16px;
            border: 1px solid rgba(225, 29, 72, 0.25);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon-box">
            <i class="fa-solid fa-compass"></i>
        </div>

        <div class="badge-code">HTTP 404 NOT FOUND</div>
        <h1 class="error-title">Page Not Found</h1>
        <div class="error-subtitle">Requested Resource Missing</div>
        <p class="error-desc">
            The page or record you requested could not be located in MALHAM.
        </p>

        <div class="btn-group-error">
            <a href="javascript:history.back()" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn-primary-glow">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </div>
    </div>

</body>
</html>

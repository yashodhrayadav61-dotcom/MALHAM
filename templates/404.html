<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found – MALHAM</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--bg-dark, #0b0e14);
            color: var(--text-main, #f0f4f8);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 210, 255, 0.1) 0%, transparent 60%);
        }

        .error-card {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 22, 31, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 210, 255, 0.15);
            backdrop-filter: blur(12px);
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #00d2ff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
            50% { box-shadow: 0 0 35px rgba(0, 210, 255, 0.6); }
        }

        .error-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .error-subtitle {
            font-size: 1.05rem;
            color: #00d2ff;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .error-desc {
            font-size: 0.92rem;
            color: #8a99ad;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-group-error {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-back {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .btn-primary-glow {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff2d55, #e00034);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-glow:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 45, 85, 0.6);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-compass-drafting"></i>
        </div>
        <h1 class="error-title">404 Not Found</h1>
        <div class="error-subtitle">Page Not Found</div>
        <p class="error-desc">
            The page or resource you are looking for could not be found.<br>
            It may have been moved, renamed, or is temporarily unavailable.
        </p>

        <div class="btn-group-error">
            <a href="javascript:history.back()" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn-primary-glow">
                <i class="fa-solid fa-house"></i> Return to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
